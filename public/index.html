<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URLclip</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>URLclip</h1>

    <div class="popurl">

        <input id="input" type="text" placeholder="Paste your long URL here...">

        <input type="text" id="aliasInput" placeholder="Custom Alias (Optional)">
        <label for="passwordInput" class="pswd">Password (Optional)</label>
        <input type="password" id="passwordInput" placeholder="Protect this link with a password" />

        <button class="btn" id="generate">Generate</button>

        <div id="linkResult"></div>

        <div id="qrResult"></div>

    </div>

    <script src="script.js"></script>

</body>

</html>
